---
AWSTemplateFormatVersion: '2010-09-09'
Description: AWS CloudFormation template to create a Cloud9 environment setup.
Metadata:
  Author:
    Description: Jagdeep Phoolkumar <jphoolku@amazon.com>
  License:
    Description: 'Copyright 2023 Amazon.com, Inc. and its affiliates. All Rights Reserved.

      Licensed under the Amazon Software License (the "License"). You may not use this file
      except in compliance with the License. A copy of the License is located at

      http://aws.amazon.com/asl/

      or in the "license" file accompanying this file. This file is distributed on an "AS IS"
      BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the
      License for the specific language governing permissions and limitations under the License.'
      
Parameters:
  C9InstanceType:
    Description: Example Cloud9 instance type
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - m5.large
    ConstraintDescription: Must be a valid Cloud9 instance type
  #Used only by Event Engine, if you are self-deploying the stack leave the default value to NONE
  EETeamRoleArn:
    Description: "ARN of the Team Role"
    Default: NONE
    Type: String
    ConstraintDescription: This is ONLY used Event Engine, don't change this if you are self-deploying the stack

Conditions: 
  NotEventEngine: !Equals [!Ref EETeamRoleArn, NONE]

Resources:
  CodeBuildRole728CBADE:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: 'sts:AssumeRole'
            Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
        Version: 2012-10-17
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AdministratorAccess'
  CodeBuildRoleDefaultPolicy829527DE:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyDocument:
        Statement:
          - Action:
              - 's3:Abort*'
              - 's3:DeleteObject*'
              - 's3:GetBucket*'
              - 's3:GetObject*'
              - 's3:List*'
              - 's3:PutObject'
              - 's3:PutObjectLegalHold'
              - 's3:PutObjectRetention'
              - 's3:PutObjectTagging'
              - 's3:PutObjectVersionTagging'
            Effect: Allow
            Resource:
              - !GetAtt 
                - TFStateBackendBucketF0FC9A9D
                - Arn
              - !Join 
                - ''
                - - !GetAtt 
                    - TFStateBackendBucketF0FC9A9D
                    - Arn
                  - /*
        Version: 2012-10-17
      PolicyName: CodeBuildRoleDefaultPolicy829527DE
      Roles:
        - !Ref CodeBuildRole728CBADE
  TFStateBackendBucketF0FC9A9D:
    Type: 'AWS::S3::Bucket'
    Properties:
      VersioningConfiguration:
        Status: Enabled
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
  StackDeployProjectA218E189:
    Type: 'AWS::CodeBuild::Project'
    Properties:
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        ComputeType: BUILD_GENERAL1_MEDIUM
        EnvironmentVariables:
          - Name: TF_STATE_S3_BUCKET
            Type: PLAINTEXT
            Value: !Ref TFStateBackendBucketF0FC9A9D
        Image: 'aws/codebuild/standard:6.0'
        ImagePullCredentialsType: CODEBUILD
        PrivilegedMode: false
        Type: LINUX_CONTAINER
      ServiceRole: !GetAtt 
        - CodeBuildRole728CBADE
        - Arn
      Source:
        BuildSpec: |
          version: 0.2
          env:
            shell: bash
            variables:
              TF_STATE_S3_BUCKET: NOT_SET
              REQUESTED_ACTION: Create
          phases:
            install:
              on-failure: ABORT
              runtime-versions:
                nodejs: 16
              commands: |
                set -e

                echo "===================================================${TF_STATE_S3_BUCKET}==================================================="
                sudo apt-get update && sudo apt-get install -y gnupg software-properties-common curl git
                curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
                sudo apt-add-repository "deb [arch=amd64] https://apt.releases.hashicorp.com $(lsb_release -cs) main"
                sudo apt-get update && sudo apt-get install terraform
            pre_build:
              on-failure: ABORT
              commands: |
                set -e
                curl "https://raw.githubusercontent.com/jagpk/ec2-spot-workshops/emr-tf/workshops/running_spark_apps_with_emr_on_spot_instances/terraform-long-running-emr.tar.gz" -o terraform-long-running-emr.tar.gz
                tar -xvzf terraform-long-running-emr.tar.gz -C $CODEBUILD_SRC_DIR
                cd $CODEBUILD_SRC_DIR/terraform-long-running-emr
                echo -e 'terraform { \n backend "s3" {}\n}' > backend_override.tf
                terraform init --backend-config="bucket=${TF_STATE_S3_BUCKET}" --backend-config="key=terraform.tfstate" --backend-config="region=${AWS_REGION}"
            build:
              on-failure: ABORT
              commands:
                - |
                  set -e

                  cd $CODEBUILD_SRC_DIR/terraform-long-running-emr

                  if [[ $REQUESTED_ACTION == 'Delete' ]]; then
                    terraform destroy --auto-approve
                  else
                    # Retry loop due to intermittent timing issues with cluster becoming available
                    s=0

                    for i in $(seq 1 3); do 
                        terraform apply -auto-approve && s=0 && break || s=$? && echo 'Sleeping until retry...' && sleep 1
                    done

                    exit $s
                  fi
        Type: NO_SOURCE
      Cache:
        Type: NO_CACHE
      EncryptionKey: alias/aws/s3
      TimeoutInMinutes: 90
  StartBuildFunctionServiceRole25C56391:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: 'sts:AssumeRole'
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: 2012-10-17
      ManagedPolicyArns:
        - !Join 
          - ''
          - - 'arn:'
            - !Ref 'AWS::Partition'
            - ':iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
  StartBuildFunctionServiceRoleDefaultPolicy53DA047E:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyDocument:
        Statement:
          - Action: 'codebuild:StartBuild'
            Effect: Allow
            Resource: !GetAtt 
              - StackDeployProjectA218E189
              - Arn
        Version: 2012-10-17
      PolicyName: StartBuildFunctionServiceRoleDefaultPolicy53DA047E
      Roles:
        - !Ref StartBuildFunctionServiceRole25C56391
  StartBuildFunction21B23CDA:
    Type: 'AWS::Lambda::Function'
    Properties:
      Code:
        ZipFile: >-

          const respond = async function(event, context, responseStatus,
          responseData, physicalResourceId, noEcho) {
            return new Promise((resolve, reject) => {
              var responseBody = JSON.stringify({
                  Status: responseStatus,
                  Reason: "See the details in CloudWatch Log Stream: " + context.logGroupName + " " + context.logStreamName,
                  PhysicalResourceId: physicalResourceId || context.logStreamName,
                  StackId: event.StackId,
                  RequestId: event.RequestId,
                  LogicalResourceId: event.LogicalResourceId,
                  NoEcho: noEcho || false,
                  Data: responseData
              });

              console.log("Response body:\n", responseBody);

              var https = require("https");
              var url = require("url");

              var parsedUrl = url.parse(event.ResponseURL);
              var options = {
                  hostname: parsedUrl.hostname,
                  port: 443,
                  path: parsedUrl.path,
                  method: "PUT",
                  headers: {
                      "content-type": "",
                      "content-length": responseBody.length
                  }
              };

              var request = https.request(options, function(response) {
                  console.log("Status code: " + response.statusCode);
                  console.log("Status message: " + response.statusMessage);
                  resolve();
              });

              request.on("error", function(error) {
                  console.log("respond(..) failed executing https.request(..): " + error);
                  resolve();
              });

              request.write(responseBody);
              request.end();
            });
          };


          const AWS = require('aws-sdk');


          exports.handler = async function (event, context) {
            console.log(JSON.stringify(event, null, 4));
            try {
              const projectName = event.ResourceProperties.ProjectName;
              const codebuild = new AWS.CodeBuild();

              console.log(`Starting new build of project ${projectName}`);

              const { build } = await codebuild.startBuild({
                projectName,
                // Pass CFN related parameters through the build for extraction by the
                // completion handler.
                //buildspecOverride: event.RequestType === 'Delete' ? 'infrastructure/buildspec-destroy.yml' : 'infrastructure/buildspec.yml',
                environmentVariablesOverride: [
                  {
                    name: 'CFN_RESPONSE_URL',
                    value: event.ResponseURL
                  },
                  {
                    name: 'CFN_STACK_ID',
                    value: event.StackId
                  },
                  {
                    name: 'CFN_REQUEST_ID',
                    value: event.RequestId
                  },
                  {
                    name: 'CFN_LOGICAL_RESOURCE_ID',
                    value: event.LogicalResourceId
                  },
                  {
                    name: 'REQUESTED_ACTION',
                    value: event.RequestType
                  }
                ]
              }).promise();
              console.log(`Build id ${build.id} started - resource completion handled by EventBridge`);
            } catch(error) {
              console.error(error);
              await respond(event, context, 'FAILED', { Error: error });
            }
          };
                
      Role: !GetAtt 
        - StartBuildFunctionServiceRole25C56391
        - Arn
      Handler: index.handler
      Runtime: nodejs16.x
      Timeout: 60
    DependsOn:
      - StartBuildFunctionServiceRoleDefaultPolicy53DA047E
      - StartBuildFunctionServiceRole25C56391

  ReportBuildFunctionServiceRole3573BFF1:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: 'sts:AssumeRole'
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: 2012-10-17
      ManagedPolicyArns:
        - !Join 
          - ''
          - - 'arn:'
            - !Ref 'AWS::Partition'
            - ':iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

  ReportBuildFunctionServiceRoleDefaultPolicy4D7DF48B:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyDocument:
        Statement:
          - Action:
              - 'codebuild:BatchGetBuilds'
              - 'codebuild:ListBuildsForProject'
            Effect: Allow
            Resource: !GetAtt 
              - StackDeployProjectA218E189
              - Arn
        Version: 2012-10-17
      PolicyName: ReportBuildFunctionServiceRoleDefaultPolicy4D7DF48B
      Roles:
        - !Ref ReportBuildFunctionServiceRole3573BFF1

  ReportBuildFunction724A99F2:
    Type: 'AWS::Lambda::Function'
    Properties:
      Code:
        ZipFile: >-

          const respond = async function(event, context, responseStatus,
          responseData, physicalResourceId, noEcho) {
            return new Promise((resolve, reject) => {
              var responseBody = JSON.stringify({
                  Status: responseStatus,
                  Reason: "See the details in CloudWatch Log Stream: " + context.logGroupName + " " + context.logStreamName,
                  PhysicalResourceId: physicalResourceId || context.logStreamName,
                  StackId: event.StackId,
                  RequestId: event.RequestId,
                  LogicalResourceId: event.LogicalResourceId,
                  NoEcho: noEcho || false,
                  Data: responseData
              });

              console.log("Response body:\n", responseBody);

              var https = require("https");
              var url = require("url");

              var parsedUrl = url.parse(event.ResponseURL);
              var options = {
                  hostname: parsedUrl.hostname,
                  port: 443,
                  path: parsedUrl.path,
                  method: "PUT",
                  headers: {
                      "content-type": "",
                      "content-length": responseBody.length
                  }
              };

              var request = https.request(options, function(response) {
                  console.log("Status code: " + response.statusCode);
                  console.log("Status message: " + response.statusMessage);
                  resolve();
              });

              request.on("error", function(error) {
                  console.log("respond(..) failed executing https.request(..): " + error);
                  resolve();
              });

              request.write(responseBody);
              request.end();
            });
          };


          const AWS = require('aws-sdk');


          exports.handler = async function (event, context) {
            console.log(JSON.stringify(event, null, 4));

            const projectName = event['detail']['project-name'];

            const codebuild = new AWS.CodeBuild();

            const buildId = event['detail']['build-id'];
            const { builds } = await codebuild.batchGetBuilds({
              ids: [ buildId ]
            }).promise();

            console.log(JSON.stringify(builds, null, 4));

            const build = builds[0];
            // Fetch the CFN resource and response parameters from the build environment.
            const environment = {};
            build.environment.environmentVariables.forEach(e => environment[e.name] = e.value);

            const response = {
              ResponseURL: environment.CFN_RESPONSE_URL,
              StackId: environment.CFN_STACK_ID,
              LogicalResourceId: environment.CFN_LOGICAL_RESOURCE_ID,
              RequestId: environment.CFN_REQUEST_ID
            };

            if (event['detail']['build-status'] === 'SUCCEEDED') {
              await respond(response, context, 'SUCCESS', {}, 'build');
            } else {
              await respond(response, context, 'FAILED', { Error: 'Build failed' });
            }
          };
                
      Role: !GetAtt 
        - ReportBuildFunctionServiceRole3573BFF1
        - Arn
      Handler: index.handler
      Runtime: nodejs14.x
      Timeout: 60
    DependsOn:
      - ReportBuildFunctionServiceRoleDefaultPolicy4D7DF48B
      - ReportBuildFunctionServiceRole3573BFF1

  BuildCompleteRule660B1845:
    Type: 'AWS::Events::Rule'
    Properties:
      Description: Build complete
      EventPattern:
        source:
          - aws.codebuild
        detail-type:
          - CodeBuild Build State Change
        detail:
          build-status:
            - SUCCEEDED
            - FAILED
            - STOPPED
          project-name:
            - !Ref StackDeployProjectA218E189
      State: ENABLED
      Targets:
        - Arn: !GetAtt 
            - ReportBuildFunction724A99F2
            - Arn
          Id: Target0
          
  BuildCompleteRuleAllowEventRuleEksWorkshopStackReportBuildFunction6EE67F6DB93C319A:
    Type: 'AWS::Lambda::Permission'
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !GetAtt 
        - ReportBuildFunction724A99F2
        - Arn
      Principal: events.amazonaws.com
      SourceArn: !GetAtt 
        - BuildCompleteRule660B1845
        - Arn

  ClusterStack:
    Type: 'AWS::CloudFormation::CustomResource'
    Properties:
      ServiceToken: !GetAtt 
        - StartBuildFunction21B23CDA
        - Arn
      ProjectName: !Ref StackDeployProjectA218E189
      BuildRoleArn: !GetAtt 
        - CodeBuildRole728CBADE
        - Arn
    DependsOn:
      - >-
        BuildCompleteRuleAllowEventRuleEksWorkshopStackReportBuildFunction6EE67F6DB93C319A
      - BuildCompleteRule660B1845
      - ReportBuildFunction724A99F2
      - ReportBuildFunctionServiceRoleDefaultPolicy4D7DF48B
      - ReportBuildFunctionServiceRole3573BFF1
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete

################## PERMISSIONS AND ROLES #################
  C9Role:
    Type: AWS::IAM::Role
    Condition: NotEventEngine
    Properties:
      Tags:
        - Key: Environment
          Value: AWS Example
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - ec2.amazonaws.com
            - ssm.amazonaws.com
          Action:
          - sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AdministratorAccess
      Path: "/"
  C9LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: "/"
      Policies:
      - PolicyName:
          Fn::Join:
          - ''
          - - C9LambdaPolicy-
            - Ref: AWS::Region
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource: arn:aws:logs:*:*:*
          - Effect: Allow
            Action:
            - cloudformation:DescribeStacks
            - cloudformation:DescribeStackEvents
            - cloudformation:DescribeStackResource
            - cloudformation:DescribeStackResources
            - ec2:DescribeInstances
            - ec2:AssociateIamInstanceProfile
            - ec2:ModifyInstanceAttribute
            - ec2:ReplaceIamInstanceProfileAssociation
            - ec2:DescribeIamInstanceProfileAssociations
            - iam:ListInstanceProfiles
            - iam:PassRole
            Resource: "*"

################## LAMBDA BOOTSTRAP FUNCTION ################

  C9BootstrapInstanceLambda:
    Description: Bootstrap Cloud9 instance
    Type: Custom::C9BootstrapInstanceLambda
    DependsOn:
    - C9BootstrapInstanceLambdaFunction
    - C9Instance
    - C9LambdaExecutionRole
    Properties:
      Tags:
        - Key: Environment
          Value: AWS Example
      ServiceToken:
        Fn::GetAtt:
        - C9BootstrapInstanceLambdaFunction
        - Arn
      REGION:
        Ref: AWS::Region
      StackName:
        Ref: AWS::StackName
      EnvironmentId:
        Ref: C9Instance
      LabIdeInstanceProfileArn: !If [ NotEventEngine, !GetAtt C9InstanceProfile.Arn, !Sub 'arn:aws:iam::${AWS::AccountId}:instance-profile/TeamRoleInstanceProfile' ]

  C9BootstrapInstanceLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Tags:
        - Key: Environment
          Value: AWS Example
      Handler: index.lambda_handler
      Role:
        Fn::GetAtt:
        - C9LambdaExecutionRole
        - Arn
      Runtime: python3.9
      MemorySize: 256
      Timeout: '600'
      Code:
        ZipFile: |
          from __future__ import print_function
          import boto3
          import logging
          import json
          import os
          import time
          import traceback
          import cfnresponse

          # logging.basicConfig(level=logging.INFO)
          # logger = logging.getLogger(__name__)

          def lambda_handler(event, context):
              # logger.info('event: {}'.format(event))
              # logger.info('context: {}'.format(context))
              responseData = {}

              if event['RequestType'] == 'Create':
                  try:
                      # Open AWS clients
                      ec2 = boto3.client('ec2')

                      # Get the InstanceId of the Cloud9 IDE
                      # print(str({'Name': 'tag:aws:cloud9:environment','Values': [event['ResourceProperties']['EnvironmentId']]}))
                      instance = ec2.describe_instances(Filters=[{'Name': 'tag:aws:cloud9:environment','Values': [event['ResourceProperties']['EnvironmentId']]}])['Reservations'][0]['Instances'][0]
                      # logger.info('instance: {}'.format(instance))

                      # Create the IamInstanceProfile request object
                      iam_instance_profile = {
                          'Arn': event['ResourceProperties']['LabIdeInstanceProfileArn']
                      }
                      # logger.info('iam_instance_profile: {}'.format(iam_instance_profile))

                      # Wait for Instance to become ready before adding Role
                      instance_state = instance['State']['Name']
                      # logger.info('instance_state: {}'.format(instance_state))
                      while instance_state != 'running':
                          time.sleep(5)
                          instance_state = ec2.describe_instances(InstanceIds=[instance['InstanceId']])
                        # logger.info('instance_state: {}'.format(instance_state))
                      
                      # removed any pre-attached instance profile
                      instance_id = instance['InstanceId']

                      response = ec2.describe_iam_instance_profile_associations(
                          Filters=[
                              {
                                  'Name': 'instance-id',
                                  'Values': [instance_id],
                              },
                          ],
                      )
                      
                      # attach instance profile
                      if len(response['IamInstanceProfileAssociations']) > 0:
                          for association in response['IamInstanceProfileAssociations']:
                              if association['State'] == 'associated':
                                  print("{} is active with state {}".format(association['AssociationId'], association['State']))
                                  ec2.replace_iam_instance_profile_association(AssociationId=association['AssociationId'], IamInstanceProfile=iam_instance_profile)
                      else:
                          ec2.associate_iam_instance_profile(IamInstanceProfile=iam_instance_profile, InstanceId=instance_id)

                      # logger.info('response - associate_iam_instance_profile: {}'.format(response))
                      r_ec2 = boto3.resource('ec2')

                      responseData = {'Success': 'Started bootstrapping for instance: '+instance['InstanceId']}
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData, 'CustomResourcePhysicalID')

                  except Exception as e:
                      responseData = {'Error': str(e)}
                      cfnresponse.send(event, context, cfnresponse.FAILED, responseData, 'CustomResourcePhysicalID')
            
################## SSM BOOTSRAP HANDLER ###############
  C9OutputBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete

  C9SSMDocument:
    Type: AWS::SSM::Document
    Properties:
      Tags:
        - Key: Environment
          Value: AWS Example
      Content: Yaml
      DocumentType: Command
      Content:
        schemaVersion: '2.2'
        description: Bootstrap Cloud9 Instance
        mainSteps:
        - action: aws:runShellScript
          name: C9bootstrap
          inputs:
            runCommand:
            - "#!/bin/bash"
            - date
            - . /home/ec2-user/.bashrc
            - whoami
            - sudo -H -u ec2-user aws sts get-caller-identity

            - echo '=== Install JQ and envsubst ==='
            - sudo yum -y install jq gettext

            - echo '=== Update to the latest AWS CLI ==='
            - sudo -H -u ec2-user aws --version
            - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            - unzip awscliv2.zip >> /home/ec2-user/environment/cli-unzip.log 
            - sudo ./aws/install >> /home/ec2-user/environment/cli-install.log
            - . /home/ec2-user/.bash_profile
            - sudo -H -u ec2-user aws --version

            - echo '=== setup AWS configs ==='
            - rm -vf /home/ec2-user/.aws/credentials
            - export ACCOUNT_ID=$(aws sts get-caller-identity --output text --query Account)
            - export AWS_REGION=$(curl -s 169.254.169.254/latest/dynamic/instance-identity/document | jq -r '.region')
            - echo "export ACCOUNT_ID=${ACCOUNT_ID}" >> /home/ec2-user/.bash_profile
            - echo "export AWS_REGION=${AWS_REGION}" >> /home/ec2-user/.bash_profile
            - sudo -H -u ec2-user aws configure set default.region ${AWS_REGION}
            - sudo -H -u ec2-user aws configure get default.region
            - sudo -H -u ec2-user aws sts get-caller-identity

            - echo '=== Install Terraform ==='
            - sudo yum install -y yum-utils
            - sudo yum-config-manager --add-repo https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo
            - sudo yum -y install terraform

            - echo '=== Copy Terraform files to Cloud9 ==='
            - curl "https://raw.githubusercontent.com/jagpk/ec2-spot-workshops/emr-tf/workshops/running_spark_apps_with_emr_on_spot_instances/terraform-long-running-emr.tar.gz" -o terraform-long-running-emr.tar.gz
            - tar -xvzf terraform-long-running-emr.tar.gz -C /home/ec2-user/environment/ 
            - cd /home/ec2-user/environment/terraform-long-running-emr/
            - !Sub sed -i.bak -e 's/<region>/${AWS::Region}/' /home/ec2-user/environment/terraform-long-running-emr/backend.tf
            - !Sub sed -i.bak -e 's/<terraform-backend-bucket>/${TFStateBackendBucketF0FC9A9D}/' /home/ec2-user/environment/terraform-long-running-emr/backend.tf
            - echo '=== Terraform Init ==='
            - sudo -H -u ec2-user /usr/bin/terraform init  >> /home/ec2-user/environment/tf-init.log
            - . /home/ec2-user/.bash_profile

  C9BootstrapAssociation:
    Type: AWS::SSM::Association
    DependsOn:
    - C9OutputBucket
    Properties:
      Name: !Ref C9SSMDocument
      OutputLocation:
        S3Location:
          OutputS3BucketName: !Ref C9OutputBucket
          OutputS3KeyPrefix: bootstrapoutput
      Targets:
        - Key: tag:SSMEMRBootstrap
          Values:
          - Active

################## INSTANCE #####################
  C9InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: NotEventEngine
    Properties:
      Path: "/"
      Roles:
      - Ref: C9Role
  C9Instance:
    Description: "-"
    DependsOn: C9BootstrapAssociation
    Type: AWS::Cloud9::EnvironmentEC2
    Properties:
      Description: AWS Cloud9 instance for Examples
      AutomaticStopTimeMinutes: 3600
      InstanceType:
        Ref: C9InstanceType
      Name: 
        Ref: AWS::StackName
      # OwnerArn: !Sub 'arn:aws:sts::${AWS::AccountId}:assumed-role/TeamRole/MasterKey'
      OwnerArn: !If [NotEventEngine , !Ref AWS::NoValue , !Sub 'arn:aws:sts::${AWS::AccountId}:assumed-role/TeamRole/MasterKey']
      Tags:
        -
          Key: SSMEMRBootstrap
          Value: Active
        -
          Key: Environment
          Value:
            Ref: AWS::StackName

Outputs:
  Cloud9IDE:
    Value:
      Fn::Join:
      - ''
      - - https://
        - Ref: AWS::Region
        - ".console.aws.amazon.com/cloud9/ide/"
        - Ref: C9Instance
        - "?region="
        - Ref: AWS::Region
  CodeBuildRoleArn:
    Value: !GetAtt 
      - CodeBuildRole728CBADE
      - Arn
  TFStateBucketArn:
    Value: !GetAtt 
      - TFStateBackendBucketF0FC9A9D
      - Arn